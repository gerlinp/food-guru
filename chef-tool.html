<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chef Tool · Food Guru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{
      --navy: #0e1a2f;
      --navy-900: #0b1220;
      --navy-800: #0f1b33;
      --navy-700: #142647;
      --navy-600: #1a305c;
      --navy-500: #213c74;
      --cream: #faf5ec;
      --cream-50: #fdfbf7;
      --cream-100: #faf5ec;
      --cream-200: #f6edda;
      --orange: #f0631c;
      --orange-50: #fff4ed;
      --orange-100: #ffe6d4;
      --orange-200: #ffc8a3;
      --orange-600: #f0631c;
      --ink: #161616;
      --ink-900: #0a0a0a;
      --ink-800: #1a1a1a;
      --ink-700: #2b2b2b;
      --ink-600: #3d3d3d;
      --ink-500: #515151;
      --ink-400: #666;
      --ink-300: #8a8a8a;
      --ink-200: #aeaeae;
      --ink-100: #d2d2d2;
      --ink-50: #f5f5f5;
      --green: #1f7a50;
      --red: #b42f2f;
      --amber: #c27914;
      --radius-lg: 18px;
      --radius-xl: 22px;
      --radius-2xl: 28px;
      --shadow-soft: 0 18px 45px rgba(0,0,0,.18);
      --shadow-subtle: 0 10px 26px rgba(0,0,0,.10);
      --shadow-floating: 0 22px 60px rgba(0,0,0,.22);
      --ease-out: cubic-bezier(.22,.61,.36,1);
      --ease-snap: cubic-bezier(.25,.46,.45,.94);
      --font-display: "Newsreader", ui-serif, Georgia, "Times New Roman", serif;
      --font-body: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      font-family: var(--font-body);
      color: var(--ink-900);
      background:
        radial-gradient(900px 600px at 12% 10%, rgba(240,99,28,.09), transparent 55%),
        radial-gradient(900px 600px at 92% 18%, rgba(14,26,47,.10), transparent 55%),
        radial-gradient(900px 600px at 55% 110%, rgba(14,26,47,.10), transparent 55%),
        linear-gradient(180deg, var(--cream-50), var(--cream-100));
    }

    #root{
      min-height:100%;
      display:flex;
      align-items:stretch;
      justify-content:center;
    }

    .frame{
      width:100%;
      max-width:430px;
      margin:0 auto;
      background: linear-gradient(180deg, #ffffff, #fdfaf4 60%, #faf5ec 100%);
      box-shadow: var(--shadow-floating);
      border-radius: 0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      position:relative;
      overflow:hidden;
    }

    @media (min-width: 520px){
      .frame{
        min-height:auto;
        height: 860px;
        max-height: 92vh;
        border-radius: var(--radius-2xl);
        margin: 32px auto;
        border: 1px solid rgba(14,26,47,.10);
      }
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 14px 16px 10px;
      gap:12px;
      position:relative;
      z-index:20;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .logo{
      width:36px;
      height:36px;
      border-radius: 14px;
      background:
        radial-gradient(16px 16px at 30% 30%, rgba(255,255,255,.55), transparent 55%),
        linear-gradient(135deg, var(--orange-600), #ff8a3d 42%, #f9a849 100%);
      box-shadow: 0 10px 26px rgba(240,99,28,.24);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }
    .brand-text{
      min-width:0;
    }
    .brand-title{
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.03em;
      font-size: 15px;
      color: var(--navy-900);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brand-sub{
      font-size: 11px;
      color: var(--ink-400);
      margin-top:-1px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(14,26,47,.06);
      border: 1px solid rgba(14,26,47,.08);
      color: var(--navy-700);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      user-select:none;
      cursor:pointer;
      transition: transform .18s var(--ease-out), background .18s var(--ease-out), border-color .18s var(--ease-out);
    }
    .pill:hover{ transform: translateY(-1px); background: rgba(14,26,47,.08); }
    .pill:active{ transform: translateY(0px) scale(.99); }

    .content{
      flex:1 1 auto;
      padding: 10px 14px 122px;
      overflow:auto;
      position:relative;
      z-index:10;
    }

    .hero{
      padding: 6px 4px 10px;
    }
    .kicker{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(14,26,47,.06);
      border: 1px solid rgba(14,26,47,.08);
      color: var(--navy-700);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      user-select:none;
    }
    .hero-title{
      font-family: var(--font-display);
      font-weight: 750;
      letter-spacing: -0.05em;
      font-size: 30px;
      line-height: .98;
      color: var(--navy-900);
      margin: 12px 0 0;
    }
    .hero-sub{
      margin: 10px 0 0;
      color: var(--ink-600);
      font-size: 14px;
      line-height: 1.35;
    }

    .mode-tabs{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:10px;
      margin: 10px 2px 0;
    }
    .mode-tab{
      position:relative;
      border-radius: 18px;
      border: 1px solid rgba(14,26,47,.10);
      background: rgba(255,255,255,.75);
      overflow:hidden;
      cursor:pointer;
      min-height: 106px;
      padding: 12px 10px 10px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition: transform .18s var(--ease-out), border-color .18s var(--ease-out), box-shadow .18s var(--ease-out), background .18s var(--ease-out);
      user-select:none;
    }
    .mode-tab:before{
      content:"";
      position:absolute;
      inset:-2px;
      opacity:0;
      transition: opacity .24s var(--ease-out);
      background:
        radial-gradient(90px 50px at 20% 10%, rgba(255,255,255,.85), transparent 55%),
        linear-gradient(135deg, rgba(240,99,28,.12), rgba(14,26,47,.06) 55%, rgba(240,99,28,.08));
      pointer-events:none;
    }
    .mode-tab:hover{
      transform: translateY(-1px);
      box-shadow: var(--shadow-subtle);
      border-color: rgba(14,26,47,.14);
      background: rgba(255,255,255,.92);
    }
    .mode-tab[data-active="true"]{
      transform: translateY(-1px);
      box-shadow: 0 18px 42px rgba(14,26,47,.16);
      border-color: rgba(240,99,28,.35);
      background: rgba(255,255,255,.98);
    }
    .mode-tab[data-active="true"]:before{ opacity:1; }
    .mode-title{
      font-family: var(--font-display);
      font-weight: 750;
      letter-spacing: -0.03em;
      font-size: 14px;
      color: var(--navy-900);
      position:relative;
      z-index:1;
    }
    .mode-sub{
      font-size: 11px;
      line-height:1.3;
      color: var(--ink-500);
      margin-top: 6px;
      position:relative;
      z-index:1;
    }
    .mode-icon{
      width: 30px;
      height: 30px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      background: rgba(14,26,47,.06);
      border: 1px solid rgba(14,26,47,.08);
      position:relative;
      z-index:1;
      align-self:flex-start;
    }

    .panel{
      margin: 14px 2px 0;
    }
    .card{
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(14,26,47,.10);
      border-radius: 22px;
      box-shadow: var(--shadow-subtle);
      overflow:hidden;
    }
    .card-section{
      padding: 14px 14px;
      border-bottom: 1px solid rgba(14,26,47,.08);
    }
    .card-section:last-child{ border-bottom:none; }
    .label-row{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 8px;
    }
    .label{
      font-weight: 700;
      letter-spacing: -0.01em;
      font-size: 13px;
      color: var(--navy-900);
      display:flex;
      align-items:center;
      gap:8px;
    }
    .hint{
      font-size: 12px;
      color: var(--ink-400);
    }
    textarea.input{
      width:100%;
      min-height: 120px;
      resize: vertical;
      border-radius: 16px;
      border: 1px solid rgba(14,26,47,.14);
      background: rgba(250,245,236,.55);
      padding: 12px 12px;
      outline:none;
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.35;
      color: var(--ink-900);
      transition: box-shadow .18s var(--ease-out), border-color .18s var(--ease-out), background .18s var(--ease-out);
    }
    textarea.input:focus{
      border-color: rgba(240,99,28,.40);
      box-shadow: 0 0 0 4px rgba(240,99,28,.10);
      background: rgba(255,255,255,.85);
    }
    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top: 6px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(250,245,236,.78);
      border: 1px solid rgba(14,26,47,.10);
      color: var(--navy-800);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor:pointer;
      user-select:none;
      transition: transform .16s var(--ease-out), border-color .16s var(--ease-out), background .16s var(--ease-out);
    }
    .chip:hover{ transform: translateY(-1px); border-color: rgba(14,26,47,.16); background: rgba(250,245,236,.95); }
    .chip:active{ transform: translateY(0px) scale(.99); }
    .chip[data-selected="true"]{
      background: rgba(240,99,28,.12);
      border-color: rgba(240,99,28,.34);
      box-shadow: 0 10px 24px rgba(240,99,28,.12);
      transform: translateY(-1px);
    }

    .row{
      display:flex;
      gap:10px;
      align-items:stretch;
    }
    .field{
      flex:1 1 0;
      min-width:0;
    }
    select.select, input.input{
      width:100%;
      border-radius: 14px;
      border: 1px solid rgba(14,26,47,.14);
      background: rgba(250,245,236,.55);
      padding: 10px 10px;
      outline:none;
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--ink-900);
      transition: box-shadow .18s var(--ease-out), border-color .18s var(--ease-out), background .18s var(--ease-out);
    }
    select.select:focus, input.input:focus{
      border-color: rgba(240,99,28,.40);
      box-shadow: 0 0 0 4px rgba(240,99,28,.10);
      background: rgba(255,255,255,.85);
    }

    .btn-primary{
      width:100%;
      border:none;
      outline:none;
      border-radius: 18px;
      padding: 12px 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-family: var(--font-body);
      font-weight: 700;
      letter-spacing: -0.01em;
      font-size: 14px;
      color: white;
      cursor:pointer;
      user-select:none;
      position:relative;
      overflow:hidden;
      background: linear-gradient(135deg, var(--orange-600), #ff8a3d 45%, #f9a849 100%);
      box-shadow: 0 18px 40px rgba(240,99,28,.24);
      transition: transform .18s var(--ease-out), box-shadow .18s var(--ease-out), filter .18s var(--ease-out);
    }
    .btn-primary:before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(120px 60px at 22% 10%, rgba(255,255,255,.55), transparent 60%);
      opacity:.9;
      pointer-events:none;
    }
    .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 22px 55px rgba(240,99,28,.28); }
    .btn-primary:active{ transform: translateY(0px) scale(.99); box-shadow: 0 14px 32px rgba(240,99,28,.22); }
    .btn-primary:disabled{
      cursor:default;
      filter: saturate(.6);
      opacity:.95;
      transform:none;
      box-shadow: 0 12px 30px rgba(240,99,28,.16);
    }
    .btn-primary:disabled:hover{ transform:none; }
    .btn-text{ position:relative; z-index:1; }

    .btn-secondary{
      border:none;
      outline:none;
      border-radius: 16px;
      padding: 10px 12px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-family: var(--font-body);
      font-weight: 700;
      letter-spacing: -0.01em;
      font-size: 13px;
      color: var(--navy-800);
      cursor:pointer;
      user-select:none;
      background: rgba(14,26,47,.06);
      border: 1px solid rgba(14,26,47,.10);
      transition: transform .16s var(--ease-out), box-shadow .16s var(--ease-out), background .16s var(--ease-out), border-color .16s var(--ease-out);
    }
    .btn-secondary:hover{ transform: translateY(-1px); box-shadow: var(--shadow-subtle); background: rgba(14,26,47,.08); border-color: rgba(14,26,47,.14); }
    .btn-secondary:active{ transform: translateY(0px) scale(.99); }

    .results{
      margin-top: 14px;
    }
    .result-card{
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(14,26,47,.10);
      border-radius: 22px;
      box-shadow: var(--shadow-subtle);
      overflow:hidden;
    }
    .result-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      padding: 14px 14px;
      border-bottom: 1px solid rgba(14,26,47,.08);
    }
    .result-title{
      font-family: var(--font-display);
      font-weight: 800;
      letter-spacing: -0.04em;
      font-size: 18px;
      line-height:1;
      color: var(--navy-900);
      margin:0;
    }
    .result-sub{
      margin: 6px 0 0;
      font-size: 12px;
      line-height:1.35;
      color: var(--ink-500);
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(31,122,80,.10);
      border: 1px solid rgba(31,122,80,.20);
      color: #165a3a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
      user-select:none;
      white-space:nowrap;
    }
    .tag[data-kind="warning"]{
      background: rgba(194,121,20,.10);
      border-color: rgba(194,121,20,.22);
      color: #925a10;
    }
    .tag[data-kind="error"]{
      background: rgba(180,47,47,.10);
      border-color: rgba(180,47,47,.20);
      color: #8b2525;
    }
    .result-body{
      padding: 12px 14px 14px;
    }
    .group{
      margin-top: 10px;
    }
    .group:first-child{ margin-top:0; }
    .group-title{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 8px;
    }
    .group-title-main{
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 13px;
      color: var(--navy-900);
      display:flex;
      align-items:center;
      gap:8px;
    }
    .group-title-hint{
      font-size: 12px;
      color: var(--ink-400);
    }
    .list{
      margin:0;
      padding:0;
      list-style:none;
      border-radius: 18px;
      border: 1px solid rgba(14,26,47,.10);
      background: rgba(250,245,236,.46);
      overflow:hidden;
    }
    .item{
      padding: 11px 12px;
      border-bottom: 1px solid rgba(14,26,47,.08);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      font-size: 13px;
      line-height:1.25;
      color: var(--ink-900);
    }
    .item:last-child{ border-bottom:none; }
    .item-left{
      min-width:0;
    }
    .item-name{
      font-weight: 750;
      letter-spacing: -0.01em;
      color: var(--navy-900);
    }
    .item-note{
      margin-top: 3px;
      color: var(--ink-500);
      font-size: 12px;
      line-height:1.3;
    }
    .item-pill{
      flex:0 0 auto;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--ink-400);
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(14,26,47,.10);
      user-select:none;
    }

    .recipe-list{
      margin:0;
      padding:0;
      list-style:none;
      display:grid;
      gap:10px;
    }
    .recipe-item{
      border-radius: 20px;
      border: 1px solid rgba(14,26,47,.10);
      background: rgba(250,245,236,.55);
      overflow:hidden;
      cursor:pointer;
      transition: transform .18s var(--ease-out), box-shadow .18s var(--ease-out), border-color .18s var(--ease-out), background .18s var(--ease-out);
    }
    .recipe-item:hover{
      transform: translateY(-1px);
      box-shadow: var(--shadow-subtle);
      border-color: rgba(14,26,47,.14);
      background: rgba(250,245,236,.78);
    }
    .recipe-item:active{ transform: translateY(0px) scale(.99); }
    .recipe-top{
      padding: 12px 12px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      border-bottom: 1px solid rgba(14,26,47,.08);
    }
    .recipe-name{
      font-family: var(--font-display);
      font-weight: 800;
      letter-spacing: -0.035em;
      font-size: 16px;
      line-height: 1.02;
      color: var(--navy-900);
      margin:0;
    }
    .recipe-meta{
      margin: 6px 0 0;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .mini{
      font-size: 11px;
      color: var(--ink-400);
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.70);
      border: 1px solid rgba(14,26,47,.08);
      user-select:none;
    }
    .score{
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 900;
      color: rgba(14,26,47,.72);
      padding: 7px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(14,26,47,.10);
      user-select:none;
      white-space:nowrap;
    }
    .recipe-bottom{
      padding: 10px 12px 12px;
    }
    .recipe-sub{
      font-size: 12px;
      line-height:1.35;
      color: var(--ink-500);
      margin:0;
    }
    .recipe-tags{
      margin-top: 8px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .tag-mini{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(14,26,47,.06);
      border: 1px solid rgba(14,26,47,.08);
      color: var(--navy-700);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: -0.01em;
      user-select:none;
    }

    .camera{
      border-radius: 22px;
      border: 1px dashed rgba(14,26,47,.22);
      background:
        radial-gradient(240px 140px at 50% 20%, rgba(255,255,255,.92), rgba(250,245,236,.55) 60%, rgba(240,99,28,.06)),
        rgba(250,245,236,.35);
      overflow:hidden;
      min-height: 210px;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      justify-content:stretch;
    }
    .camera video{
      width:100%;
      height: 220px;
      object-fit:cover;
      display:block;
      background: rgba(14,26,47,.92);
    }
    .camera canvas{ display:none; }
    .camera-empty{
      min-height: 210px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: 14px 14px;
      gap:10px;
      text-align:center;
    }
    .camera-icon{
      width: 54px;
      height: 54px;
      border-radius: 22px;

  // Data: sample recipes (kept logic lightweight, no dependency on external files)
  const sampleRecipes = [

  // Lightweight kitchen NLP (mimics original lib behavior for demo)
  const normalizeToken = (t) => t.toLowerCase().trim();

  const matchIngredient = (needle, hay) => {
    const n = normalizeToken(needle);
    const h = normalizeToken(hay);
    if (!n || !h) return 0;
    if (n === h) return 1;
    if (h.includes(n)) return 0.85;
    if (n.includes(h)) return 0.75;
    const tokens = n.split(/\s+/).filter(Boolean);
    const hits = tokens.filter(t => h.includes(t)).length;
    if (hits === 0) return 0;
    return Math.min(0.65, 0.35 + (hits / Math.max(tokens.length, 1)) * 0.30);
  };

  const parseIngredientsText = (text) => {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const parsed = lines.map((line, idx) => {
      const m = line.match(/^(.+?)\s*[-:|]\s*(.+)$/);
      if (m) {
        return { name: m[1].trim(), amount: m[2].trim(), originalIndex: idx };
      }
      return { name: line, amount: "", originalIndex: idx };
    });
    return parsed;
  };

  const analyzeIngredients = (ingredients, recipes) => {
    const pairs = [];
    for (const r of recipes) {
      const haveNames = ingredients.map(x => x.name);
      const required = r.ingredients.map(x => x.name);

      const hits = [];
      const misses = [];

      for (const req of required) {
        const scored = haveNames.map(have => ({ have, score: matchIngredient(req, have) }));
        const best = scored.reduce((a, b) => b.score > a.score ? b : a, { have: "", score: 0 });
        if (best.score > 0.45) {
          hits.push({ required: req, matched: best.have, score: best.score });
        } else {
          misses.push({ required: req, hint: "Consider alternatives if missing" });
        }
      }

      const coverage = required.length ? Math.min(1, hits.length / required.length) : 0;
      const avgScore = hits.length ? hits.reduce((s, x) => s + x.score, 0) / hits.length : 0;
      const score = coverage * 0.65 + avgScore * 0.35;

      pairs.push({
        recipe: r,
        score,
        coverage,
        avgScore,
        hits,
        misses,
        totalRequired: required.length,
        totalHave: haveNames.length,
      });
    }

    pairs.sort((a, b) => b.score - a.score);
    return pairs;

  const transformRecipe = (recipe, targetStyle) => {
    const rule = transformRules.find(r => r.to === targetStyle);

        headline: `${recipe.name}`,
        subhead: `Ready in ${recipe.timeMinutes} minutes`,

        transformedIngredients: recipe.ingredients.map(i => ({ ...i, note: "Keep as original." })),

        tips: [
          "Taste and adjust seasoning before serving.",
          "Prep ingredients ahead for a smoother workflow."
        ]

    }

    const applySubs = (text) => {
      let out = text;
      for (const sub of rule.substitutions) {
        out = out.replace(sub.pattern, (m) => {
          const r = typeof sub.replacer === "function" ? sub.replacer(m) : sub.replacer;
          return r;
        });
      }
      return out;
    };

    const transformedIngredients = recipe.ingredients.map(i => {
      const nextName = applySubs(i.name);
      const changed = nextName !== i.name;
      return {
        ...i,
        name: nextName,
        note: changed ? `Prefer ${nextName} for a ${rule.to} style.` : "Keep as original."
      };
    });

    const steps = recipe.instructions.map((text, idx) => {
      const next = applySubs(text);
      const changed = next !== text;
      return {
        index: idx+1,
        text: next,
        tip: changed ? "Adjust technique to match the lighter, quicker, or plant-based style." : null

    return {

      subhead: rule.desc,
      summary: `${recipe.name} optimized for ${targetStyle} cooking.`,

    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const titleLine = lines[0] || "Scanned Item";

    const keywords = {

      positives: ["whole grain", "organic", "no added", "low sodium", "high fiber", "protein", "vitamin", "mineral"]
    };

    const lower = text.toLowerCase();

    const foundAllergens = keywords.allergens.filter(k => lower.includes(k));
    const foundAdditives = keywords.additives.filter(k => lower.includes(k));
    const foundPositives = keywords.positives.filter(k => lower.includes(k));

    const flags = [];
    if (foundAllergens.length) flags.push("allergens");
    if (foundAdditives.length) flags.push("additives");

    let sentiment = "neutral";
    if (foundPositives.length > 1 && !foundAdditives.length && foundAllergens.length === 0) sentiment = "positive";
    if (foundAdditives.length || foundAllergens.length >= 2) sentiment = "warning";

    // Simple "ingredients" from nouns (very lightweight)
    const tokens = lower
      .replace(/[^a-z\s]/g, " ")
      .split(/\s+/)
      .filter(Boolean)
      .filter(t => t.length > 2);

    const topIngredients = [...new Set(tokens)].slice(0, 12).map(name => ({ name, note: "Detected from scan" }));

    return {
      title: titleLine.slice(0, 80),
      summary: sentiment === "positive"
        ? "This product looks relatively clean with beneficial markers."
        : sentiment === "warning"
        ? "Note potential allergens or additives; use your best judgment."
        : "Quick scan done. Review the list and decide based on your preferences.",
      sentiment,
      topIngredients,
      allergens: foundAllergens,
      additives: foundAdditives,
      positives: foundPositives,
      fullText: text
    };
  };

  const ScannerPanel = () => {
    const [mode, setMode] = useState("idle"); // idle | camera | text

    const [result, setResult] = useState(null);
    const [cameraStatus, setCameraStatus] = useState("");
    const [working, setWorking] = useState(false);

    const videoRef = useRef(null);
    const canvasRef = useRef(null);
    const streamRef = useRef(null);

    const stopCamera = useCallback(() => {
      if (streamRef.current) {
        streamRef.current.getTracks().forEach(t => t.stop());
        streamRef.current = null;
      }
      if (videoRef.current) {
        videoRef.current.srcObject = null;
      }
      setCameraStatus("");
      setMode("idle");
    }, []);

    const startCamera = useCallback(async () => {
      setResult(null);
      setMode("camera");
      setCameraStatus("Requesting camera…");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
        }
        setCameraStatus("Camera on — frame the label");
      } catch (e) {
        setCameraStatus("Camera access blocked. Try Paste instead.");
        setTimeout(() => setMode("idle"), 800);
      }
    }, []);

    const captureAndAnalyze = useCallback(() => {
      if (!videoRef.current || !canvasRef.current) return;
      const video = videoRef.current;
      const canvas = canvasRef.current;
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 360;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // In a real app, run Tesseract.ocr() here.
      // For this prototype, we simulate "OCR-like" extraction from user text or a mock.
      setCameraStatus("Analyzing…");
      setWorking(true);

      // If user provided text, use it; otherwise use a canned label mock.
      const mockLabel = text.trim() ? text : `
        Ingredients: whole grain oats, sugar, canola oil, wheat flour, honey, salt, cinnamon, natural flavor.
        Contains: wheat. May contain traces of nuts, milk, and soy.
        Vitamins and minerals: calcium carbonate, iron, zinc, vitamin C, vitamin E, niacinamide, vitamin B6.
      `;

      setTimeout(() => {
        const out = scanLikeOCR(mockLabel);
        setResult(out);
        setWorking(false);
        setCameraStatus("Scan ready — review below");
      }, 850);
    }, [text]);

      setMode("text");
      setWorking(true);
      setResult(null);

        const out = scanLikeOCR(text);
        setResult(out);
        setWorking(false);
      }, 620);

              )}
            </div>
          </div>

          <div className="card-section">
            <div className="label-row">
              <label className="label" htmlFor="scanner-text">
                <Icon name="Upload" size={14} stroke="var(--navy-700)" />
                Paste label text
              </label>
              <span className="hint">Or leave blank for a demo</span>
            </div>
            <textarea
              id="scanner-text"
              className="input"
              style={{minHeight: 92}}
              placeholder="Paste an ingredients list or label text here.&#10;&#10;If you leave it blank and tap Analyze, we'll use a demo label to show how it works."
              value={text}
              onChange={(e) => { setText(e.target.value); setResult(null); }}
            />
          </div>

          <div className="card-section">
            <button
              type="button"
              className="btn-primary"
              onClick={handleAnalyzeText}
              disabled={working}
              aria-label="Analyze label text"
            >
              {working ? <span className="spinner" aria-hidden="true" /> : <Icon name="Sparkles" size={18} stroke="rgba(255,255,255,.95)" />}
              <span className="btn-text">{working ? "Analyzing…" : "Analyze"}</span>
            </button>
          </div>
        </div>

        {result && (
          <div className="results" aria-live="polite">
            <div className="result-card">
              <div className="result-head">
                <div>
                  <h2 className="result-title">{result.title}</h2>
                  <p className="result-sub">{result.summary}</p>
                </div>
                <span
                  className="tag"
                  data-kind={
                    result.sentiment === "warning" ? "error" :
                    result.sentiment === "positive" ? undefined : "warning"
                  }
                >
                  <Icon
                    name={result.sentiment === "positive" ? "Check" : "Info"}
                    size={12}
                    stroke={
                      result.sentiment === "warning" ? "#8b2525" :
                      result.sentiment === "positive" ? "#165a3a" : "#925a10"
                    }
                  />
                  Scan: {result.sentiment}
                </span>
              </div>

              <div className="result-body">
                {result.topIngredients.length ? (
                  <div className="group">
                    <div className="group-title">
                      <div className="group-title-main">
                        <Icon name="Info" size={14} stroke="var(--navy-700)" />
                        Top ingredients detected
                      </div>
                      <span className="group-title-hint">{result.topIngredients.length} tokens</span>
                    </div>
                    <ol className="list">
                      {result.topIngredients.map((i, idx) => (
                        <li key={idx} className="item">
                          <div className="item-left">
                            <div className="item-name">{i.name}</div>
                            <div className="item-note">{i.note}</div>
                          </div>
                          <div className="item-pill">#{idx+1}</div>
                        </li>
                      ))}
                    </ol>
                  </div>
                ) : null}

                <div className="divider" style={{marginTop:"10px"}} />

                <div className="group">
                  <div className="group-title">
                    <div className="group-title-main">
                      <Icon name="Check" size={14} stroke="var(--navy-700)" />
                      Highlights
                    </div>
                    <span className="group-title-hint">Quick decision signals</span>
                  </div>
                  <ul className="list">
                    <li className="item">
                      <div className="item-left">
                        <div className="item-name">Allergens</div>
                        <div className="item-note">
                          {result.allergens.length
                            ? `Watch for: ${result.allergens.join(", ")}`
                            : "No obvious common allergens found in this scan."}
                        </div>
                      </div>
                      <div className="item-pill">{result.allergens.length || "0"}</div>
                    </li>
                    <li className="item">
                      <div className="item-left">
                        <div className="item-name">Additives / processed markers</div>
                        <div className="item-note">
                          {result.additives.length
                            ? `Note: ${result.additives.join(", ")}`
                            : "No obvious additive markers flagged."}
                        </div>
                      </div>
                      <div className="item-pill">{result.additives.length || "0"}</div>
                    </li>
                    <li className="item">
                      <div className="item-left">
                        <div className="item-name">Cleaner signals</div>
                        <div className="item-note">
                          {result.positives.length
                            ? `Liked: ${result.positives.join(", ")}`
                            : "No strong cleaner markers found in this text."}
                        </div>
                      </div>
                      <div className="item-pill">{result.positives.length || "0"}</div>
                    </li>
                  </ul>
                </div>

              </div>
            </div>
          </div>
        )}
      </section>
    );
  };

  // App shell
  const App = () => {
    const [mode, setMode] = useState("transform");

    const handleModeChange = useCallback((next) => {
      if (!["transform","fridge","scanner"].includes(next)) next = "transform";
      setMode(next);
      window.scrollTo?.({ top: 0, behavior: "smooth" });
    }, []);

    return (
      <div className="frame" role="application" aria-label="Food Guru Chef Tool">
        <header className="topbar">
          <div className="brand">
            <div className="logo" aria-hidden="true">
              <Icon name="ChefHat" size={20} stroke="rgba(255,255,255,.95)" />
            </div>
            <div className="brand-text">
              <div className="brand-title">Food Guru</div>
              <div className="brand-sub">Chef Tool · {mode === "transform" ? "Transform" : mode === "fridge" ? "Fridge Raid" : "Scanner"}</div>
            </div>
          </div>

          <button
            type="button"
            className="pill"
            onClick={() => {
              const url = new URL(location.href);
              url.hash = "";
              url.search = "";
              location.href = url.href;
            }}
            aria-label="Reset tool"
          >
            <Icon name="Refresh" size={14} stroke="var(--navy-700)" />
            Reset
          </button>
        </header>

        <main className="content">
          <Hero mode={mode} />
          <ModeTabs mode={mode} onMode={handleModeChange} />

          {mode === "transform" && <TransformPanel />}
          {mode === "fridge" && <FridgePanel />}
          {mode === "scanner" && <ScannerPanel />}
        </main>

        <BottomNav mode={mode} onMode={handleModeChange} />
      </div>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
</body>
</html>
